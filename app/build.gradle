plugins {
    id 'com.android.application'
}

android {
    namespace 'com.souvik.videocompressor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.souvik.videocompressor'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '2.0'
        ndk { abiFilters 'arm64-v8a' }   // the ffmpeg library is published for 64-bit phones only
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ffmpeg with x264/x265 (GPL build) - same engine the original Video Compressor app uses
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min-gpl:8.1.7'
    // ffmpeg-kit needs this at runtime but the fork's POM does not pull it in (caused NoClassDefFoundError)
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}
